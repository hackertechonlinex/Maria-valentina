<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Convite 1 ano — Maria Valentina ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a0a0a;
    }

    .carousel {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #1a0a0a;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Áreas clicáveis transparentes */
    .hotspot {
      position: absolute;
      z-index: 5;
      cursor: pointer;
      background: transparent;
      border: none;
      -webkit-tap-highlight-color: rgba(230, 57, 70, 0.25);
    }
  </style>
</head>
<body>
  <div class="carousel" id="carousel">

    <!-- SLIDE 1 - Capa -->
    <div class="slide">
      <img src="page-1.png" alt="Capa do convite - Maria Valentina">
      <!-- Selo / envelope (área maior e mais centralizada) -->
      <a class="hotspot"
         href="#"
         style="left: 15%; top: 45%; width: 70%; height: 32%;"
         aria-label="Clique no selo e descubra"
         onclick="goToSlide(1); return false;"></a>
    </div>

    <!-- SLIDE 2 - Data e botões -->
    <div class="slide">
      <img src="page-2.png" alt="Data, horário e localização">

      <!-- Confirma presença (botão amarelo do topo) -->
      <a class="hotspot"
         href="https://w.app/xai4qy"
         target="_blank"
         rel="noopener"
         style="left: 12%; top: 5%; width: 76%; height: 13%;"
         aria-label="Confirma presença"></a>

      <!-- Localização -->
      <a class="hotspot"
         href="https://maps.app.goo.gl/yXvWvF5MMQHV9s6E7?g_st=ic"
         target="_blank"
         rel="noopener"
         style="left: 18%; top: 19%; width: 64%; height: 10%;"
         aria-label="Localização"></a>

      <!-- Sugestão de presente (botão de baixo) -->
      <a class="hotspot"
         href="#"
         style="left: 15%; top: 84%; width: 70%; height: 10%;"
         aria-label="Sugestão de presente"
         onclick="goToSlide(2); return false;"></a>
    </div>

    <!-- SLIDE 3 - Sugestão de presente -->
    <div class="slide">
      <img src="page-3.png" alt="Sugestão de presente">
    </div>

  </div>

  <script>
    const carousel = document.getElementById('carousel');

    function goToSlide(index) {
      carousel.scrollTo({
        left: index * carousel.clientWidth,
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
