<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Convite 1 ano — Maria Valentina ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a0a0a;
    }

    .carousel {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #1a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Hotspots serão posicionados em pixels pelo JS */
    .hotspot {
      position: absolute;
      z-index: 5;
      cursor: pointer;
      background: transparent;
      border: none;
      -webkit-tap-highlight-color: rgba(230, 57, 70, 0.3);
    }
  </style>
</head>
<body>
  <div class="carousel" id="carousel">

    <!-- SLIDE 1 -->
    <div class="slide" data-slide="0">
      <img src="page-1.png" alt="Capa" id="img0">
      <a class="hotspot" data-for="selo" href="#" onclick="goToSlide(1); return false;" aria-label="Clique no selo"></a>
    </div>

    <!-- SLIDE 2 -->
    <div class="slide" data-slide="1">
      <img src="page-2.png" alt="Detalhes" id="img1">
      <a class="hotspot" data-for="confirma" href="https://w.app/xai4qy" target="_blank" rel="noopener" aria-label="Confirma presença"></a>
      <a class="hotspot" data-for="local" href="https://maps.app.goo.gl/yXvWvF5MMQHV9s6E7?g_st=ic" target="_blank" rel="noopener" aria-label="Localização"></a>
      <a class="hotspot" data-for="sugestao" href="#" onclick="goToSlide(2); return false;" aria-label="Sugestão de presente"></a>
    </div>

    <!-- SLIDE 3 -->
    <div class="slide" data-slide="2">
      <img src="page-3.png" alt="Sugestão de presente" id="img2">
    </div>

  </div>

  <script>
    const carousel = document.getElementById('carousel');

    // Coordenadas em % da imagem original (0-100)
    // Ajustadas visualmente para bater exatamente nos botões
    const HOTSPOTS = {
      selo:      { left: 18, top: 48, width: 64, height: 28 },
      confirma:  { left: 18, top: 7.2, width: 64, height: 9.5 },
      local:     { left: 34, top: 22.5, width: 42, height: 7.5 },
      sugestao:  { left: 20, top: 85, width: 60, height: 8 }
    };

    function positionHotspots() {
      document.querySelectorAll('.slide').forEach(slide => {
        const img = slide.querySelector('img');
        if (!img || !img.complete) return;

        const slideRect = slide.getBoundingClientRect();
        const imgRect = img.getBoundingClientRect();

        // Offset da imagem dentro do slide
        const offsetX = imgRect.left - slideRect.left;
        const offsetY = imgRect.top  - slideRect.top;
        const imgW = imgRect.width;
        const imgH = imgRect.height;

        slide.querySelectorAll('.hotspot').forEach(hotspot => {
          const key = hotspot.dataset.for;
          const h = HOTSPOTS[key];
          if (!h) return;

          hotspot.style.left   = (offsetX + imgW * h.left   / 100) + 'px';
          hotspot.style.top    = (offsetY + imgH * h.top    / 100) + 'px';
          hotspot.style.width  = (imgW * h.width  / 100) + 'px';
          hotspot.style.height = (imgH * h.height / 100) + 'px';
        });
      });
    }

    function goToSlide(index) {
      carousel.scrollTo({
        left: index * carousel.clientWidth,
        behavior: 'smooth'
      });
    }

    // Posiciona quando as imagens carregam e quando a tela gira/redimensiona
    window.addEventListener('load', positionHotspots);
    window.addEventListener('resize', positionHotspots);
    window.addEventListener('orientationchange', () => setTimeout(positionHotspots, 200));

    // Garante que rode mesmo se a imagem já estiver em cache
    document.querySelectorAll('img').forEach(img => {
      if (img.complete) positionHotspots();
      else img.addEventListener('load', positionHotspots);
    });

    // Reposiciona um pouco depois do carregamento (alguns celulares precisam)
    setTimeout(positionHotspots, 300);
    setTimeout(positionHotspots, 800);
  </script>
</body>
</html>
